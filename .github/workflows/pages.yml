name: Pages

# Builds the live dashboard in site/ from the committed level-*/ results, data and docs and publishes it to GitHub Pages.
# npm run build first runs site/src/pipeline.check.mjs, so a browser port that drifts from the Python fails the deploy.
on:
  push:
    branches: [main]
    paths: ['site/**', 'level-*/results_*.json', 'level-*/*.jsonl', 'level-1-learn/pipeline.py', 'level-3-deep/rules.json', 'tests/*.py', 'README.md', 'REPORT.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
