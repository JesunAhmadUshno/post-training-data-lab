name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: layout check (required files, no public grade)
        run: python tests/test_layout.py
      - name: baseline (level 1) tests
        run: python tests/test_learn_post_training_data.py
      - name: build (level 2) tests
        run: python tests/test_build_post_training_data.py
      - name: deep (level 3) tests
        run: python tests/test_deep_post_training_data.py
      - name: follow-up study tests (dose, ablation, seeds, sweep)
        run: python tests/test_studies_post_training_data.py
      - name: results reproduced from the code, byte for byte
        run: ./reproduce.sh
      - name: committed files unchanged by the runs
        run: git diff --exit-code
