name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: scaffold smoke test
        run: python tests/test_smoke.py
      - name: level 1 learn tests
        run: python tests/test_learn_post_training_data.py
      - name: level 1 learn run
        run: python level-1-learn/run_learn.py
      - name: level 2 build tests
        run: python tests/test_build_post_training_data.py
      - name: level 2 build run
        run: python level-2-build/run_build.py
      - name: level 3 deep tests
        run: python tests/test_deep_post_training_data.py
      - name: level 3 deep run
        run: python level-3-deep/run_deep.py
      - name: follow-up study tests (dose, ablation, seeds, sweep)
        run: python tests/test_studies_post_training_data.py
      - name: follow-up study runs
        run: python level-2-build/run_dose.py && python level-3-deep/run_sweep.py
      - name: committed outputs unchanged by the runs
        run: git diff --exit-code
